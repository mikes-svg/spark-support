# Spark Support — /gauntlet QA manifest
#
# Run the app in e2e mode so the harness can reach the routed pages at all:
#   npx vite --mode e2e --port 5177
# See .env.e2e and the E2E_USER block in src/context/AuthContext.tsx for why
# (Firebase keeps its session in IndexedDB; Playwright cannot carry it in).
#
# KNOWN LIMIT of every authenticated flow below: the stand-in harness user has
# no Firebase credential, so Firestore denies every read and pages render their
# chrome with EMPTY data. These flows therefore cover routing, navigation,
# layout, and empty/error states — not data rendering. `no-failed-requests` is
# deliberately omitted from them, because under a credential-less user every
# Firestore call is *expected* to 403 and the check cannot tell that apart from
# a real break. Re-enable it once the harness can authenticate for real.
#
# Flows whose URL carries ?e2eSignedOut audit the signed-out state instead.
#
# SELECTOR NOTE: the sidebar renders a desktop copy (`hidden md:flex`, i.e.
# display:none below 768px) that stays in the DOM at narrow widths. Playwright's
# text selectors take `.first()` in DOM order and do NOT skip display:none, so a
# bare `text=<nav label>` assertion resolves to that invisible copy and an
# assert-visible on it times out even though the page is fine. So at stress/mobile
# these flows assert on page-BODY text that the sidebar does not also contain, and
# nav-click coverage lives in `sidebar-navigation` at laptop, where the rail is
# always visible.

app:
  url: http://localhost:5177
  start: "npx vite --mode e2e --port 5177"
  ready: /
  ignore-console:
    # Firebase's popup-session probing under cross-origin-isolation headers.
    - "Cross-Origin-Opener-Policy"
    # Expected: onboarding rules are not deployed, and the harness user holds no
    # credential, so every Firestore read is denied by design in this mode.
    - "Missing or insufficient permissions"
    - "permission-denied"
    - "FirebaseError"
    # The pages' own handled-failure logging for the denials above.
    - "Failed to load"
    - "Failed to fetch"
    - "installations/request-failed"
    # The Firestore SDK's long-poll auto-detect probe fires a Listen channel on
    # pages with no onSnapshot; under the credential-less harness user it 403s as
    # an uncaught pageerror no app handler can catch. Expected in e2e mode only.
    - "Firestore/Listen/channel"
    - "due to access control checks"

flows:
  # ── New feature: Property Onboarding ──────────────────────────────────────
  - name: onboarding-properties
    starting_url: /onboarding/properties
    critical: true
    viewports: [stress, mobile, laptop]
    steps:
      # Body-unique text (see SELECTOR NOTE); "Property Onboarding" is header-only.
      - assert-visible: "text=No property selected"
      - assert-visible: "text=New Property"
    checks:
      - page-loads
      - no-console-errors
      - no-horizontal-overflow
      - buttons-clickable
      - no-clipped-text
      - images-load
      - min-font-size
      - contrast-minimum
      - "cta-reachable:text=New Property"

  - name: onboarding-template
    starting_url: /onboarding/template
    critical: true
    viewports: [stress, mobile, laptop]
    steps:
      # Body text (see SELECTOR NOTE); "Checklist Template" is header-only.
      - assert-visible: "text=master checklist"
      - assert-visible: "text=Add Section"
    checks:
      - page-loads
      - no-console-errors
      - no-horizontal-overflow
      - buttons-clickable
      - no-clipped-text
      - images-load
      - min-font-size
      - contrast-minimum
      - "cta-reachable:text=Add Section"

  - name: onboarding-my-tasks
    starting_url: /onboarding
    critical: true
    viewports: [stress, mobile, laptop]
    steps:
      # Subtitle text (see SELECTOR NOTE); "My Tasks" also lives in the sidebar.
      - assert-visible: "text=sorted by urgency"
    checks:
      - page-loads
      - no-console-errors
      - no-horizontal-overflow
      - buttons-clickable
      - no-clipped-text
      - images-load
      - min-font-size
      - contrast-minimum

  # Security: the guards must hold for a signed-out visitor. ?e2eSignedOut
  # suppresses the stand-in user, so these are genuine unauthenticated hits.
  - name: onboarding-access-guards
    starting_url: /onboarding?e2eSignedOut
    critical: true
    viewports: [mobile, laptop]
    steps:
      - assert-visible: "text=Sign in with Google"
      - goto: /onboarding/properties?e2eSignedOut
      - assert-visible: "text=Sign in with Google"
      - goto: /onboarding/template?e2eSignedOut
      - assert-visible: "text=Sign in with Google"
      - goto: /admin/team?e2eSignedOut
      - assert-visible: "text=Sign in with Google"
    checks:
      - page-loads
      - no-console-errors
      - no-failed-requests

  # ── Regression: surfaces this branch modified ─────────────────────────────
  # The Sidebar's repeated NavLink markup was extracted into one shared
  # component driving all three nav groups — the highest regression risk here.
  # Laptop only: the persistent desktop rail is always visible there, so nav
  # clicks resolve unambiguously. At narrow widths the nav is a drawer whose
  # duplicated DOM breaks text selectors (see SELECTOR NOTE); that interaction
  # is a known coverage gap pending a visible-only selector in the harness.
  - name: sidebar-navigation
    starting_url: /
    critical: true
    viewports: [laptop]
    steps:
      - assert-visible: "text=Submit Request"
      - click: "text=Properties"
      - assert-visible: "text=No property selected"
      - click: "text=My Tasks"
      - assert-visible: "text=sorted by urgency"
      - click: "text=Template"
      - assert-visible: "text=master checklist"
      - click: "text=All Tickets"
      - assert-visible: "text=Reset Filters"
      - click: "text=Team"
      - assert-visible: "text=Manage Users"
    checks:
      - page-loads
      - no-console-errors
      - buttons-clickable
      - no-clipped-text
      - images-load
      - min-font-size
      - contrast-minimum

  - name: team-page
    starting_url: /admin/team
    viewports: [stress, mobile, laptop]
    steps:
      # "Property Onboarding" (permissions matrix) is body-unique; bare
      # "Onboarding" also matches the sidebar group (see SELECTOR NOTE).
      - assert-visible: "text=Manage Users"
      - assert-visible: "text=Role Permissions"
      - assert-visible: "text=Property Onboarding"
      - click: "text=Add User"
      - assert-visible: "text=Add New User"
      # Close the modal so buttons-clickable doesn't flag the backdrop-covered
      # nav behind it (a modal backdrop intercepting clicks is correct behaviour).
      - press: "Escape"
      - wait-for: 300
    checks:
      - page-loads
      - no-console-errors
      - no-horizontal-overflow
      - buttons-clickable
      - no-clipped-text
      - min-font-size
      - contrast-minimum

  - name: ticket-dashboard
    starting_url: /
    viewports: [stress, mobile, laptop]
    steps:
      # Body headings/CTAs, not sidebar labels (see SELECTOR NOTE).
      - assert-visible: "text=Overview"
      - goto: /admin
      - assert-visible: "text=Reset Filters"
      - goto: /submit
      - assert-visible: "text=Submit New Request"
    checks:
      - page-loads
      - no-console-errors
      - no-horizontal-overflow
      - buttons-clickable
      - no-clipped-text
      - min-font-size
      - contrast-minimum

  - name: login-page
    starting_url: /login?e2eSignedOut
    viewports: [stress, mobile, tablet, laptop]
    steps:
      - assert-visible: "text=Sign in with Google"
    checks:
      - page-loads
      - no-console-errors
      - no-failed-requests
      - no-horizontal-overflow
      - buttons-clickable
      - no-clipped-text
      - images-load
      - min-font-size
      - contrast-minimum
      - "cta-reachable:text=Sign in with Google"
